name: build-levipack

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            zipfile=$(ls -1 *.zip | head -n1)
            echo "Using $zipfile"
            mkdir -p _proj
            unzip -q "$zipfile" -d _proj
            cm=$(find _proj -name CMakeLists.txt | head -n1)
            echo "PROJ=$(dirname "$cm")" >> "$GITHUB_ENV"
          fi

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          echo "Installed NDKs:"; ls /usr/local/lib/android/sdk/ndk || true
          NDK=""
          for v in 28 27; do
            cand=$(ls -d /usr/local/lib/android/sdk/ndk/$v.* 2>/dev/null | sort -V | tail -n1)
            if [ -n "$cand" ]; then NDK="$cand"; break; fi
          done
          if [ -z "$NDK" ]; then NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"; fi
          echo "Using NDK: $NDK"
          cmake -S "$PROJ" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_CXX_FLAGS="-include cstdlib" \
            -DCMAKE_SHARED_LINKER_FLAGS="-llog"

      - name: Build
        run: cmake --build build --parallel

      - name: Package .levipack
        run: |
          MODID=auto_attack
          mkdir -p "pkg/$MODID"
          cp "$PROJ/manifest.json" "pkg/$MODID/"
          cp build/out/libauto_attack.so "pkg/$MODID/"
          (cd "pkg/$MODID" && zip -r "../../AutoAttack.levipack" .)
          ls -l AutoAttack.levipack build/out/

      - uses: actions/upload-artifact@v4
        with:
          name: AutoAttack
          path: |
            AutoAttack.levipack
            build/out/libauto_attack.so
