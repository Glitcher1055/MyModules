name: Build elytra_swap

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get ImGui
        run: git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui

      - name: Build arm64 .so
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
          $CXX -std=c++20 -shared -fPIC -O2 -static-libstdc++ \
            -I imgui \
            elytra_swap.cpp \
            imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
            -o libelytra_swap.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libelytra_swap
          path: libelytra_swap.so
