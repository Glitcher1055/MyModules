name: build-levipack

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly mode: if the repo only contains a .zip of the project,
      # unpack it and build from there.
      - name: Locate project
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            zipfile=$(ls -1 *.zip | head -n1)
            echo "Using $zipfile"
            mkdir -p _proj
            unzip -q "$zipfile" -d _proj
            cm=$(find _proj -name CMakeLists.txt | head -n1)
            echo "PROJ=$(dirname "$cm")" >> "$GITHUB_ENV"
          fi

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          cmake -S "$PROJ" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Build
        run: cmake --build build --parallel

      - name: Package .levipack
        run: |
          MODID=elytra_swap
          mkdir -p "pkg/$MODID"
          cp "$PROJ/manifest.json" "pkg/$MODID/"
          cp build/out/libelytra_swap.so "pkg/$MODID/"
          (cd "pkg/$MODID" && zip -r "../../ElytraSwap.levipack" .)
          ls -l ElytraSwap.levipack build/out/

      - uses: actions/upload-artifact@v4
        with:
          name: ElytraSwap
          path: |
            ElytraSwap.levipack
            build/out/libelytra_swap.so
