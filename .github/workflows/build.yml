name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack project
        run: |
          unzip -q -o GlitchLauncher.zip -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")" >> $GITHUB_ENV
      - name: Build
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Show error
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "### Причина ошибки" >> $GITHUB_STEP_SUMMARY
          grep -E "Caused by|Exception|e: " build.log | head -40 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        with:
          name: GlitchLauncher-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
